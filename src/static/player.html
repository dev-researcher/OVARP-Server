<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVARP Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
      "fflate": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/fflate.module.js"
    }
  }
  </script>
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --emerald: #10b981;
      --rose: #f43f5e;
      --amber: #f59e0b;
      --bg: #0b1120;
      --bg-card: #111827;
      --border: rgba(255,255,255,0.09);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    header .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .status.online { color: var(--emerald); }
    .status.offline { color: var(--rose); }
    a.console-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    a.console-link:hover { color: var(--accent-hover); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 1.1fr) minmax(280px, 0.9fr);
      min-height: 0;
    }
    #avatar-canvas {
      min-height: 320px;
      background: #1a1a2e;
    }
    .chat-pane {
      display: grid;
      grid-template-rows: 1fr auto;
      border-left: 1px solid var(--border);
      min-height: 0;
    }
    #chat-log {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 90%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }
    .bubble.agent {
      align-self: flex-start;
      background: #1e293b;
    }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }
    #chat-input {
      flex: 1;
      background: #1a2233;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #send-btn { background: var(--accent); color: #fff; }
    #send-btn:hover { background: var(--accent-hover); }
    #mic-btn { background: #1e293b; color: var(--text); }
    #mic-btn.recording { background: var(--rose); color: #fff; }
    #stop-audio-btn { background: transparent; color: var(--muted); }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
      .chat-pane { border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <h1>OVARP Player</h1>
    <div class="meta">
      <span id="conn-status" class="status offline">Disconnected</span>
      <a class="console-link" href="/">Back to console</a>
    </div>
  </header>
  <main>
    <div id="avatar-canvas" aria-label="Agent avatar"></div>
    <section class="chat-pane">
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Type a message..." aria-label="Message">
        <button id="send-btn" type="submit">Send</button>
        <button id="mic-btn" type="button">Hold to talk</button>
        <button id="stop-audio-btn" type="button">Stop audio</button>
      </form>
    </section>
  </main>

  <script type="module">
    import OVARPClient from './sdk/ovaf-client.js?v=13';

    const chatLog = document.getElementById('chat-log');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const connStatus = document.getElementById('conn-status');
    const micBtn = document.getElementById('mic-btn');
    const stopAudioBtn = document.getElementById('stop-audio-btn');

    function appendChat(role, text) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      chatLog.appendChild(bubble);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function setStatus(online, label) {
      connStatus.className = `status ${online ? 'online' : 'offline'}`;
      connStatus.textContent = label;
    }

    const client = new OVARPClient({
      deviceId: 'web_panel_01',
      agentId: 'agent_alpha',
      canvas: document.getElementById('avatar-canvas'),
      callbacks: {
        onConnect: () => setStatus(true, 'Connected'),
        onDisconnect: () => setStatus(false, 'Reconnecting...'),
        onMessage: (sub) => {
          const text = typeof sub === 'string' ? sub : (sub?.text || '');
          if (text) appendChat('agent', text);
        },
        onLog: (msg, type) => {
          if (type === 'error') console.warn('[OVARP Player]', msg);
        }
      }
    });

    client.connect();
    client.loadAvatar('/models/friet256.glb').catch((err) => {
      console.warn('[OVARP Player] Avatar load failed', err);
    });

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      appendChat('user', text);
      client.sendText(text);
      chatInput.value = '';
    });

    const startMic = async () => {
      micBtn.classList.add('recording');
      micBtn.textContent = 'Listening...';
      await client.startMic();
    };
    const stopMic = () => {
      micBtn.classList.remove('recording');
      micBtn.textContent = 'Hold to talk';
      client.stopMic();
    };

    micBtn.addEventListener('mousedown', startMic);
    micBtn.addEventListener('mouseup', stopMic);
    micBtn.addEventListener('mouseleave', () => {
      if (micBtn.classList.contains('recording')) stopMic();
    });
    micBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      startMic();
    });
    micBtn.addEventListener('touchend', (event) => {
      event.preventDefault();
      stopMic();
    });

    stopAudioBtn.addEventListener('click', () => client.stopAudio());
  </script>
</body>
</html>
